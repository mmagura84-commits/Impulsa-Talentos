name: Deploy to Hostinger
on:
  # Manual-only after the 2026-08-27 incident: a push trigger auto-cleared public_html and
  # failed to upload index.html/spa-fallback.html, taking impulsatalentos.expert down (403/404).
  # This workflow now runs ONLY on explicit "Run workflow" dispatch by an authorized maintainer,
  # and only after the change is QA-certified. The canonical deploy path remains the LOCAL
  # deploy.sh against the live project (cmdqlybsgkegolqydmbh).
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.2
      - name: Build
        env:
          # LIVE consolidated Supabase project values (2026-08-13).
          # DO NOT replace with legacy (wpnkeryyhsdsislqaegb) or staging (gszjlvqmfwoedvxkvvaf) refs.
          # The anon key is public by design (shipped in the client bundle); the legacy repo SECRETS
          # point at the frozen legacy project and must NOT be used here.
          VITE_SUPABASE_URL: https://cmdqlybsgkegolqydmbh.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNtZHFseWJzZ2tlZ29scXlkbWJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxNDYxNzksImV4cCI6MjEwMTcyMjE3OX0.VTalByKsYkNvc7JX9OIkAk--7Ex7UeCZYSvlwDb9Lr4
          SITE_URL: https://impulsatalentos.expert
        run: |
          bun install --frozen-lockfile
          bun run build
          cp .htaccess dist/.htaccess
      - name: Guard — bundle must target the LIVE Supabase project
        run: |
          if grep -rq --include='*.js' 'wpnkeryyhsdsislqaegb' dist/assets/; then
            echo "::error::dist bundle references LEGACY Supabase project wpnkeryyhsdsislqaegb — refusing to deploy"
            exit 1
          fi
          if ! grep -rq --include='*.js' 'cmdqlybsgkegolqydmbh' dist/assets/; then
            echo "::error::dist bundle does not reference LIVE Supabase project cmdqlybsgkegolqydmbh — refusing to deploy"
            exit 1
          fi
          echo "Bundle Supabase target OK: LIVE cmdqlybsgkegolqydmbh"
      - name: Guard — build is complete
        run: |
          test -f dist/index.html && test -f dist/spa-fallback.html && test -f dist/.htaccess && test -f dist/index.php || { echo "::error::dist/index.html, .htaccess or index.php missing"; exit 1; }
      - name: Deploy (upload to staging folder, verify, then swap — never clears the live site first)
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
          USER_: ${{ secrets.HOSTINGER_USER }}
          LIVE: /home/u774117868/websites/0D7T1hSPl/public_html
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Hostinger's shared SSH sits behind several nodes that present
          # different host keys from one connection to the next, so a pinned
          # known_hosts fails with "REMOTE HOST IDENTIFICATION HAS CHANGED"
          # (run #199). The runner is throwaway; the deploy key is the guard.
          SSH="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ConnectTimeout=15 -p $PORT"
          COUNT=$(find dist -type f | wc -l | tr -d ' ')
          INCOMING="$LIVE/.deploy/incoming"; PREV="$LIVE/.deploy/prev"
          # One compressed stream instead of scp's file-by-file transfer: the
          # build is ~900 small files and this host kept closing the connection
          # part-way through (run #240, "scp: Connection closed"). Retried
          # twice, since the drop is on their side and a half-upload is thrown
          # away each time (the live site is only swapped after the upload is
          # verified complete).
          for attempt in 1 2 3; do
            $SSH "$USER_@$HOST" "rm -rf '$INCOMING' && mkdir -p '$INCOMING'"
            if tar -C dist -czf - . | $SSH "$USER_@$HOST" "tar -C '$INCOMING' -xzf -"; then
              GOT=$($SSH "$USER_@$HOST" "find '$INCOMING' -type f | wc -l | tr -d ' '")
              [ "$GOT" = "$COUNT" ] && break
              echo "::warning::upload attempt $attempt landed $GOT of $COUNT files"
            else
              echo "::warning::upload attempt $attempt was cut off by the host"
            fi
            [ "$attempt" = 3 ] && { echo "::error::could not upload the build after 3 attempts"; exit 1; }
            sleep 10
          done
          $SSH "$USER_@$HOST" bash -s -- "$LIVE" "$INCOMING" "$PREV" "$COUNT" < scripts/remote-swap.sh
          echo "Deploy complete"
      - name: Flush Hostinger's cache (optional, needs HOSTINGER_API_TOKEN)
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        run: |
          # Hostinger API: Clear website cache (same as hPanel > Dashboard > Flush cache).
          # Token: hPanel > Account > API (add it as the repo secret HOSTINGER_API_TOKEN).
          if [ -z "$HOSTINGER_API_TOKEN" ]; then
            echo "HOSTINGER_API_TOKEN not set: skipping the optional cache flush (pages refresh themselves through /sw.js)."
            exit 0
          fi
          code=$(curl -sS -o /tmp/flush.json -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H "Accept: application/json" \
            "https://developers.hostinger.com/api/hosting/v1/accounts/u774117868/websites/impulsatalentos.expert/cache/clear")
          echo "Hostinger answered HTTP $code"
          if [ "$code" -ge 300 ]; then head -c 400 /tmp/flush.json; echo; echo "::error::Cache flush failed (HTTP $code)"; exit 1; fi
      - name: Wait until visitors get this build
        run: |
          # Pages load through /sw.js as /path?_b=<build> (a URL the CDN has
          # never cached), so the new build is what visitors get even if the
          # CDN still holds old copies of the plain URLs.
          BUILD=$(node -p "require('./dist/version.json').build")
          ASSET=$(grep -aoE '/assets/[^"]+\.js' dist/index.html | head -1)
          [ -n "$BUILD" ] && [ -n "$ASSET" ] || { echo "::error::dist is missing version.json or a script"; exit 1; }
          echo "Waiting for build $BUILD"
          for i in $(seq 1 24); do
            ok=1
            curl -fsS "https://impulsatalentos.expert/version.json?b=$RANDOM$i" | grep -qF "$BUILD" || ok=0
            for p in / /privacy/ /jobs/; do
              curl -fsS --compressed "https://impulsatalentos.expert$p?_b=$BUILD" | grep -aqF "$ASSET" || ok=0
            done
            [ "$ok" = 1 ] && break
            sleep 10
          done
          [ "$ok" = 1 ] || { echo "::error::The live site does not serve build $BUILD after 4 minutes"; exit 1; }
          echo "Visitors get build $BUILD"
          # Plain URLs (no ?_b=): pages are served by page.php with s-maxage=60,
          # so the CDN must hand out this build within ~a minute of the swap.
          for i in $(seq 1 10); do
            ok=1
            for p in / /privacy/ /jobs/; do
              curl -fsS --compressed "https://impulsatalentos.expert$p" | grep -aqF "$ASSET" || ok=0
            done
            [ "$ok" = 1 ] && break
            sleep 15
          done
          if [ "$ok" = 1 ]; then echo "CDN serves build $BUILD on plain URLs"
          else echo "::warning::The CDN still holds older copies of the plain URLs after 2.5 minutes (visitors are still refreshed to the new build by /sw.js; a flush in hPanel clears it)"; fi
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Smoke-test the live site (read-only)
        env:
          E2E_BASE_URL: https://impulsatalentos.expert
        run: npx playwright test
      - name: Speed check — phones must see the main content within 2 s
        # Lighthouse mobile (PageSpeed's phone + slow-4G settings), median of 3
        # runs per page; the results table is in the run summary.
        run: node scripts/speed-check.mjs https://impulsatalentos.expert "$(node -p "require('./dist/version.json').build")"
      - name: Keep the Playwright report when checks fail
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-results
          path: test-results/
          retention-days: 14
