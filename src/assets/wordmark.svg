<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 44" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="wm-grad" x1="6" y1="38" x2="38" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1f3a8a" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="wm-accent" x1="20" y1="6" x2="20" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <!-- Mark: gradient tile + chevron + apex dot + radiating pulse arcs -->
  <rect x="2" y="2" width="40" height="40" rx="10" fill="url(#wm-grad)" />
  <!-- Concentric pulse arcs (talent radiating outward) -->
  <path d="M6 14 A14 14 0 0 1 34 14" stroke="#ffffff" stroke-width="0.9" stroke-opacity="0.35" fill="none" stroke-linecap="round" />
  <path d="M9 17 A11 11 0 0 1 31 17" stroke="#ffffff" stroke-width="0.9" stroke-opacity="0.55" fill="none" stroke-linecap="round" />
  <!-- Upward chevron (impulse) -->
  <path d="M12 30 L22 14 L32 30" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <!-- Apex dot (the talent being launched) -->
  <circle cx="22" cy="14" r="2.4" fill="url(#wm-accent)" />
  <!-- Wordmark — same family + weight as the hero h1 (font-serif, font-bold) -->
  <text
    x="52"
    y="32"
    font-family="'Lora', ui-serif, Georgia, serif"
    font-weight="700"
    font-size="24"
    fill="#0f172a"
    letter-spacing="-0.4"
  >Impulsa</text>
  <text
    x="135"
    y="32"
    font-family="'Lora', ui-serif, Georgia, serif"
    font-weight="700"
    font-size="24"
    fill="#3b82f6"
    letter-spacing="-0.4"
  >Talentos</text>
</svg>
